events {
}

http {

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTPS — Let's Encrypt (issued under /etc/letsencrypt)
    server {
        listen 443 ssl;
        server_name s.cympfh.cc;

        ssl_certificate     /etc/letsencrypt/live/s.cympfh.cc/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/s.cympfh.cc/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # djtube (https://github.com/cympfh/djtube)
        # Proxied directly (not via :80) so X-Real-IP is the real client and
        # the bare-path redirect stays on https.
        location = /djtube {
            return 301 /djtube/;
        }
        location /djtube/ {
            proxy_pass http://172.17.0.1:8098/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Reuse the HTTP vhost routes (same container listens on 80).
        location / {
            proxy_pass http://127.0.0.1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {

        listen 80;
        server_name s.cympfh.cc;

        # ACME HTTP-01
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        #
        # date-server: A sample server
        #
        location /date {
            rewrite /(.*) / break;
            proxy_pass       http://s.cympfh.cc:8000;
        }

        #
        # journal
        #
        location /journal {
            proxy_pass       http://s.cympfh.cc:8081;
        }

        #
        # search
        # cympfh-search (https://github.com/cympfh/cympfh-search)
        #
        # location /search {
        #     proxy_pass       http://s.cympfh.cc:8083;
        # }

        #
        # book (booklog-database, http://s.cympfh.cc/book/cympfh/
        #
        location  /book {
            proxy_pass       http://s.cympfh.cc:8084;
        }

        #
        # Othello (https://github.com/cympfh/othello-is-not-reversi)
        #
        # location /othello {
        #     proxy_pass       http://s.cympfh.cc:8086;
        # }

        #
        # anime (https://github.com/cympfh/island)
        #
        location /anime {
            proxy_pass       http://s.cympfh.cc:8087;
        }

        #
        # dosoku dashboard (https://github.com/cympfh/dosoku-dashboard)
        #
        # location ^~ /dashboard {
        #     proxy_pass       http://s.cympfh.cc:8089;
        # }

        #
        # web-manga RSS
        #
        location /rss {
            proxy_pass       http://s.cympfh.cc:8091;
        }

        #
        # shields (https://github.com/cympfh/shields
        #
        location /shields {
            proxy_pass       http://s.cympfh.cc:8092;
        }

        #
        # chilingo (https://github.com/cympfh/chilingo
        #
        location /chilingo {
            proxy_pass       http://s.cympfh.cc:8094;
        }

        #
        # video (https://github.com/cympfh/video
        #
        location /video {
            proxy_pass       http://s.cympfh.cc:8095;
        }

        #
        # eliza (https://github.com/cympfh/eliza-agent-server
        #
        location /eliza {
            proxy_pass       http://s.cympfh.cc:8096;
        }

        #
        # mini-hsk5 (https://github.com/cympfh/mini-hsk-5)
        #
        location = /mini-hsk5 {
            return 301 /mini-hsk5/;
        }
        location /mini-hsk5/ {
            proxy_pass       http://s.cympfh.cc:8097/;
        }

        #
        # djtube (https://github.com/cympfh/djtube)
        #
        location = /djtube {
            return 301 /djtube/;
        }
        # 8098 is published only on 127.0.0.1 and the docker0 gateway
        # (172.17.0.1); this nginx runs in a bridged container, so it reaches
        # djtube via the gateway. proxy_set_header here replaces (does not
        # extend) the server-level ones, so they are all repeated.
        location /djtube/ {
            proxy_pass       http://172.17.0.1:8098/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

    }
}
