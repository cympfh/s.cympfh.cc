---
- hosts: deploy
  vars:
    repo: https://github.com/cympfh/djtube
    tag: djtube
    full_command: >-
      docker run -d
        -p 127.0.0.1:8098:8098
        -p 172.17.0.1:8098:8098
        --restart=always
        --name={{ tag }}
        -v djtube-data:/app/data
        --env YOUTUBE_API_KEY={{ youtube.api_key }}
        {{ tag }}
  roles:
  - docker_build
  - docker_deploy
